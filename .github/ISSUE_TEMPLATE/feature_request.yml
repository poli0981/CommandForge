name: Feature request
description: A new feature, only when it fits the project and is genuinely necessary (maintenance mode)
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **CommandForge is in maintenance mode.** A new feature is added only when it clearly fits the
        project and is genuinely necessary — for example, to keep the app safe or working on a new
        Windows build. Other requests are closed with a link to
        [the policy](../blob/main/.github/CONTRIBUTING.md#maintenance-mode-what-we-accept).

        - A catalog command to add, fix or remove has its own form: **Command — add, fix or remove**.
        - An idea to share, without commitment: [Discussions › Ideas](../discussions/categories/ideas).
  - type: checkboxes
    id: scope
    attributes:
      label: Maintenance mode
      options:
        - label: I have read the maintenance-mode policy, and this is not a catalog command.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: necessity
    attributes:
      label: Why is it necessary?
      description: What breaks, or stays unsafe or out of reach, without it? An idea that is nice to have belongs in Discussions › Ideas.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should CommandForge do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
