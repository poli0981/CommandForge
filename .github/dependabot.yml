version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Labels that exist in the repository (a missing label is silently dropped).
    labels: ["dependencies", ".NET"]
    cooldown:
      default-days: 3
      semver-major-days: 14
    # The app stays on the .NET 10 LTS line: Microsoft.Extensions.* majors follow .NET majors, and
    # moving to a new .NET major is a deliberate migration done by hand, not a Dependabot bump.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      serilog:
        patterns: ["Serilog*"]
      # The Velopack library and the vpk CLI (.config/dotnet-tools.json) must move together.
      velopack:
        patterns: ["Velopack", "vpk"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*"]
      # Includes the SonarScanner CLI pinned in .config/dotnet-tools.json.
      build-tooling:
        patterns: ["SonarAnalyzer.CSharp", "dotnet-sonarscanner", "Microsoft.Windows.CsWin32"]

  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["dependencies", ".NET"]
    # Patch and feature-band SDKs only; a new .NET major (11, 12…) is moved to by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github_actions"]
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
