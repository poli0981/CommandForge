name: Announce Release

# Posts a release announcement to Discord (reuses the shared workflow in poli0981/.github).
# Tag releases are announced by release.yml itself (a release published with GITHUB_TOKEN does
# not fire the `release` event); this workflow covers releases published by hand and re-runs.
# Requires repo secret DISCORD_RELEASES_WEBHOOK (or DISCORD_REPO_WEBHOOK); optional
# DISCORD_PING_ROLE_ID.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (e.g. v2.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    uses: poli0981/.github/.github/workflows/announce-release.yml@c3e118a01d40e95b36b2c3466dc206638c11eb5a # main, 2026-07-06
    with:
      tag_override: ${{ github.event.inputs.tag || '' }}
    secrets: inherit
