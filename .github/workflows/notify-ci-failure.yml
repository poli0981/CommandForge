name: Notify CI Failure

# Posts a Discord alert when the Build or SonarCloud workflow fails on main (reuses the shared
# workflow in poli0981/.github). Requires repo secret DISCORD_CI_WEBHOOK.

on:
  workflow_run:
    workflows: ["Build", "SonarCloud"]
    types: [completed]

# The reusable workflow requests actions: read; without granting it here every run was a
# startup_failure (the repository default token is read-only for contents only).
permissions:
  actions: read
  contents: read

jobs:
  notify:
    # Both workflows only run on `push` for main, so this limits alerts to main without trusting
    # forgeable values (branch names, actor logins) — and skips pull-request runs (including
    # Dependabot's), which have no access to the webhook secret anyway.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push'
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@c3e118a01d40e95b36b2c3466dc206638c11eb5a # main, 2026-07-06
    secrets: inherit
