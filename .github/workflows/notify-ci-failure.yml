name: Notify CI Failure

# Posts a Discord alert when the Build workflow fails on main (reuses the shared workflow in
# poli0981/.github). Requires repo secret DISCORD_CI_WEBHOOK.

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

# The reusable workflow requests actions: read; without granting it here every run was a
# startup_failure (the repository default token is read-only for contents only).
permissions:
  actions: read
  contents: read

jobs:
  notify:
    # Dependabot-triggered runs get no Actions secrets, so the required webhook is unavailable.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@main
    secrets: inherit
