name: Release

# Triggered by pushing a SemVer tag (vX.Y.Z). Builds a self-contained, Velopack-packaged
# release and publishes it to GitHub Releases with build-provenance attestations, SHA-256
# checksums, an SPDX SBOM and (optionally) a VirusTotal scan. No code signing yet (see SECURITY.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 2.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC for build-provenance attestations
      attestations: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve version and tag
        id: ver
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION
            $tag = "v$version"
          } else {
            $tag = $env:REF_NAME
            $version = $tag -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' is not X.Y.Z" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version (tag $tag)"

      - name: Restore pinned tools (vpk)
        run: dotnet tool restore

      - name: Download previous release (delta base)
        continue-on-error: true # the very first release has nothing to download
        shell: pwsh
        run: dotnet vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN

      - name: Publish + pack (Velopack)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/pack.ps1 -Version $env:VERSION

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Releases/*-Setup.exe
            Releases/*.nupkg

      - name: Publish GitHub Release (Velopack)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: >-
          dotnet vpk upload github
          --repoUrl $env:REPO_URL
          --token $env:GH_TOKEN
          --publish
          --releaseName "CommandForge $env:VERSION"
          --tag $env:TAG

      - name: SBOM + SHA-256 checksums
        shell: pwsh
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $rel = Join-Path (Get-Location) 'Releases'
          $sbom = Join-Path $rel 'sbom.spdx.json'
          gh api "repos/$env:REPOSITORY/dependency-graph/sbom" --jq '.sbom' | Out-File $sbom -Encoding utf8NoBOM
          $checksums = Join-Path $rel 'checksums.txt'
          # Filter with Where-Object, not Get-ChildItem -Exclude (which returns nothing without a
          # trailing wildcard/-Recurse and once produced an empty checksums.txt).
          Get-ChildItem -Path $rel -File |
            Where-Object { $_.Name -ne 'checksums.txt' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Out-File $checksums -Encoding ascii
          gh release upload $env:TAG $sbom $checksums --clobber

      - name: VirusTotal scan (optional)
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          update_release_body: true
          files: |
            Releases/*-Setup.exe
            Releases/*-full.nupkg

  announce:
    # A release published with GITHUB_TOKEN does not fire the `release` event, so the standalone
    # announce workflow never ran for tag releases — call the shared announcer directly instead.
    needs: release
    permissions:
      contents: read
    uses: poli0981/.github/.github/workflows/announce-release.yml@main
    with:
      tag_override: ${{ needs.release.outputs.tag }}
    secrets: inherit
