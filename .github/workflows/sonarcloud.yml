name: SonarCloud

# CI-based SonarCloud analysis (it replaced Automatic Analysis, which can't import coverage): the
# solution is built between the scanner's begin and end steps, the tests run with OpenCover
# coverage, and the SonarCloud GitHub App reports the quality gate on pull requests. The scanner
# turns TreatWarningsAsErrors off for its build, so build.yml stays the warnings-as-errors check.
# Requires the repository secret SONAR_TOKEN.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  token:
    # Pull requests from forks and from Dependabot get no repository secrets. Checking for the token
    # skips those runs without trusting actor or repository names from the event.
    name: Check for SONAR_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check for SONAR_TOKEN
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not available to this run (fork or Dependabot pull request); skipping the analysis."
          fi

  analysis:
    name: SonarCloud
    needs: token
    if: needs.token.outputs.available == 'true'
    # WPF (net10.0-windows) only builds on Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: SonarCloud uses blame to tell new code from old
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Both caches stay outside the workspace: the scanner also analyzes every .json, .yml and .ps1
      # file under the repository root.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-sonar-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-sonar-${{ runner.os }}-

      - name: Cache SonarCloud analyzers and JRE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('.config/dotnet-tools.json') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: Restore pinned tools (dotnet-sonarscanner)
        run: dotnet tool restore

      # The project version drives SonarCloud's "previous version" new-code period.
      # Roslyn rules already fail the build in build.yml, so their Info-level suggestions aren't
      # imported as external issues. Coverage skips XAML code-behind and the two entry points (the
      # app and the Elevator); the catalog JSON and the .resx files repeat structure by design.
      - name: Begin analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $version = "$(dotnet msbuild src/CommandForge.Domain/CommandForge.Domain.csproj -getProperty:Version | Select-Object -Last 1)".Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected project version '$version'." }
          $scannerArgs = @(
            'begin', '/k:poli0981_CommandForge', '/o:poli0981', "/v:$version",
            '/d:sonar.host.url=https://sonarcloud.io', "/d:sonar.token=$env:SONAR_TOKEN",
            '/d:sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml',
            '/d:sonar.cs.vstest.reportsPaths=TestResults/*.trx',
            '/d:sonar.cs.roslyn.ignoreIssues=true',
            '/d:sonar.exclusions=**/bin/**,**/obj/**,**/TestResults/**',
            '/d:sonar.coverage.exclusions=**/*.xaml.cs,**/Program.cs',
            '/d:sonar.cpd.exclusions=**/Catalog/*.json,**/*.resx'
          )
          dotnet sonarscanner @scannerArgs
          if ($LASTEXITCODE -ne 0) { throw "SonarScanner begin failed with exit code $LASTEXITCODE." }

      - name: Build
        # Real source paths in the PDBs (not the /_/ deterministic ones), so coverage maps to files.
        run: dotnet build CommandForge.slnx -c Release --no-incremental -p:ContinuousIntegrationBuild=false

      - name: Test with coverage
        run: >-
          dotnet test CommandForge.slnx -c Release --no-build
          --collect "XPlat Code Coverage;Format=opencover"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end "/d:sonar.token=$env:SONAR_TOKEN"
